# Infrastructure as a reviewable diff (ADR-0008). This lives beside the code it
# deploys, not in a separate infra repository, because for one developer that
# indirection is overhead.
#
# ONE service. The queue is dormant (ADR-0012): there is exactly one background
# job — a password-reset email — and it is sent synchronously in the request.
# Redis, a worker and a beat scheduler would cost ~$17/month to deliver an
# occasional email a second sooner. The Celery task, its pinned name and the
# `make task-names` gate all remain, so restoring the queue is a `.delay()` and
# the commented block at the bottom of this file.
#
# ─── region ───────────────────────────────────────────────────────────────────
# `virginia`, not Frankfurt. The Neon database lives at
# `ep-…-pooler.c-2.us-east-1.aws.neon.tech` — us-east-1, which is N. Virginia.
#
# ADR-0008 says to colocate with the database, because the database round trip
# dominates any edge-proximity argument. That reasoning was right; an earlier
# version of this file put the services in Frankfurt and asserted, in a comment,
# that this was "beside Neon". It was not. Every query would have crossed the
# Atlantic.
#
# The better end state is to recreate the Neon project in eu-central-1 and move
# back to Frankfurt — colocated *and* ~150ms from Kigali instead of ~230ms. Worth
# doing while the database holds only `users` and the JWT blacklist tables. Once
# orders are in it, that is a real migration.

previewsEnabled: false

services:
  - type: web
    name: boutique-backend
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/docs/

    # No dockerCommand. Render splits it on whitespace and execs it directly —
    # there is no shell, so `migrate && gunicorn` is impossible: `&&` is passed to
    # `migrate` as an argument. Wrapping it in `sh -c` does not help; the quotes
    # survive the split. The start sequence lives in the image, in entrypoint.sh,
    # where `docker run` exercises exactly what Render runs.

    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true # Render generates it once and keeps it; never in git.
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_APPEND_SLASH
        value: "True"
      # `property: host` resolves to the *subdomain* (`boutique-backend-4pw6`),
      # not the hostname, so Django would reject every request with
      # DisallowedHost. Set the full hostname explicitly.
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false # https://<host>, set once in the dashboard
      - key: FRONTEND_URL
        sync: false # the Vercel deployment
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false # Neon's POOLED endpoint — the host with `-pooler` in it
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      # 2587, not 587. Render blocks outbound traffic to ports 25, 465 and 587
      # from free web services (changelog, 2025-09-26); port 25 stays blocked on
      # every plan, because Render runs on EC2. A blocked port does not refuse
      # the connection, it swallows the SYN — so this presents as a ~130s hang,
      # not an error. Resend also listens on 2465 (implicit TLS) and 2587
      # (STARTTLS) for exactly this case.
      #
      # On a paid plan, 587 works and this can go back.
      - key: EMAIL_PORT
        value: "2587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True" # 2587 is STARTTLS, same as 587. (2465 would be USE_SSL.)
      # Fail in ten seconds rather than in two minutes. See settings.py: gunicorn's
      # --timeout does not bound a request under the gthread worker, so this is the
      # only limit on how long an unauthenticated caller can hold a thread.
      - key: EMAIL_TIMEOUT
        value: "10"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # No CELERY_BROKER_URL. `send_password_reset` calls `.apply()`, which runs
      # the task in this process and never opens a broker connection.
# ─── the queue, dormant ───────────────────────────────────────────────────────
#
# Restore this when ADR-0012's reversal condition is met: a second asynchronous
# task, or the first one whose loss actually matters. A password-reset email lost
# to a restart means the customer clicks the link again. An order confirmation
# lost to a restart is a different conversation.
#
# To restore: uncomment, add CELERY_BROKER_URL to the web service, and change
# `send_password_reset` back to `.delay()`. The task name is already pinned, so
# nothing in the broker or in a beat row breaks.
#
# Beat is folded into the worker with `-B`. Safe only while there is exactly one
# worker: two workers, each running an embedded scheduler, fire every periodic
# task twice. Split it out before scaling the worker to 2.
#
