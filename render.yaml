#        sync: false
#      - key: DATABASE_URL
#        sync: false
#      - key: CELERY_BROKER_URL
#        fromService: { type: keyvalue, name: boutique-redis, property: connectionString }
#      - key: EMAIL_BACKEND
#        value: django.core.mail.backends.smtp.EmailBackend
#      - key: EMAIL_HOST
#        sync: false
#      - key: EMAIL_PORT
#        value: "587"
