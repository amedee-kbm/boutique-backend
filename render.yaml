# Postgres is Neon's, not Render's. DATABASE_URL points at Neon's *pooled*
# endpoint, and settings pin CONN_MAX_AGE = 0 and DISABLE_SERVER_SIDE_CURSORS =
# True for it. See docs/engineering-notes.md.
