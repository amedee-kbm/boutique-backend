# Infrastructure as a reviewable diff (ADR-0008). This lives beside the code it
# deploys, not in a separate infra repository, because for one developer that
# indirection is overhead.
#
# Frankfurt, not somewhere closer to Kigali: Neon has no African region, so the
# database round trip dominates any edge-proximity argument. The application
# belongs next to its database.
#
# Nothing here needs a persistent disk. Postgres is Neon's, images will be R2's.
# That statelessness is what makes a managed platform correct rather than a VPS.

previewsEnabled: false

services:
  # ─── web ───────────────────────────────────────────────────────────────────
  - type: web
    name: boutique-backend
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/docs/

    # Migrations run once, here, before any new instance takes traffic. Running
    # them in the container's entrypoint would race every other instance that
    # boots at the same time, and the loser applies a migration twice or reads a
    # half-migrated schema.
    # The image sets WORKDIR /app/src, so this is relative to the source root.
    preDeployCommand: python manage.py migrate --noinput

    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true # Render generates once and keeps it; never in git.
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_APPEND_SLASH
        value: "True"
      - key: DJANGO_ALLOWED_HOSTS
        fromService: { type: web, name: boutique-backend, property: host }
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false # https://<host>, set once in the dashboard
      - key: FRONTEND_URL
        sync: false # the Vercel deployment
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false # Neon's POOLED endpoint — the host with `-pooler` in it
      - key: CELERY_BROKER_URL
        fromService: { type: keyvalue, name: boutique-redis, property: connectionString }
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        sync: false

  # ─── celery worker ─────────────────────────────────────────────────────────
  # Runs the password-reset mail, so a slow SMTP server never delays a response.
  - type: worker
    name: boutique-celery
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A boutique worker --loglevel=info --concurrency=2
    envVars: &worker_env
      - key: DJANGO_SECRET_KEY
        fromService: { type: web, name: boutique-backend, envVarKey: DJANGO_SECRET_KEY }
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_APPEND_SLASH
        value: "True"
      - key: DJANGO_ALLOWED_HOSTS
        value: ""
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: ""
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CELERY_BROKER_URL
        fromService: { type: keyvalue, name: boutique-redis, property: connectionString }
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        sync: false

  # ─── celery beat ───────────────────────────────────────────────────────────
  # No periodic tasks exist yet. Beat runs anyway, so that the first scheduled
  # task is a code change rather than an infrastructure change — and so that this
  # service is exercised long before anything depends on it.
  - type: worker
    name: boutique-celery-beat
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A boutique beat --loglevel=info
    envVars: *worker_env

  # ─── redis ─────────────────────────────────────────────────────────────────
  # Celery's broker, and nothing else. This application does not cache.
  # `noeviction` because a broker that silently drops messages under memory
  # pressure is a broker that loses a customer's password-reset email.
  - type: keyvalue
    name: boutique-redis
    plan: starter
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: [] # reachable only from inside Render's network

# Postgres is Neon's, not Render's. DATABASE_URL points at Neon's *pooled*
# endpoint — the host with `-pooler` in it — and settings pin CONN_MAX_AGE = 0
# and DISABLE_SERVER_SIDE_CURSORS = True for it. See docs/engineering-notes.md.
